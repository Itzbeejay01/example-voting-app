name: CI
on:
  push:
    branches: [capstone-1/devops]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/itzbeejay01/example-voting-app
jobs:
  test-build-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { service: [vote, result, worker] }
    steps:
      - uses: actions/checkout@v4
      - if: matrix.service == 'result'
        uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: result/package-lock.json }
      - if: matrix.service == 'result'
        run: npm ci && npm test && npm audit --omit=dev --audit-level=high
        working-directory: result
      - if: matrix.service == 'vote'
        run: python -m compileall -q app.py
        working-directory: vote
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: ${{ matrix.service == 'vote' && 'final' || '' }}
          load: true
          push: false
          tags: local/${{ matrix.service }}:${{ github.sha }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - if: github.event_name != 'pull_request'
        run: docker tag "local/${{ matrix.service }}:${GITHUB_SHA}" "${IMAGE_PREFIX}-${{ matrix.service }}:${GITHUB_SHA}" && docker push "${IMAGE_PREFIX}-${{ matrix.service }}:${GITHUB_SHA}"
  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: POSTGRES_PASSWORD=ci-local-placeholder docker compose config --quiet
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false && terraform validate
        working-directory: terraform
      - uses: azure/setup-helm@v4
      - run: helm lint helm/voting-app && helm template voting-app helm/voting-app --set postgres.existingSecret=test-secret >/dev/null
