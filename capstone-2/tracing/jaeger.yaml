apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: monitoring }
spec:
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ name: ui, containerPort: 16686 }, { name: otlp-grpc, containerPort: 4317 }, { name: otlp-http, containerPort: 4318 }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: monitoring }
spec: { selector: { app: jaeger }, ports: [{ name: ui, port: 16686 }, { name: otlp-grpc, port: 4317 }, { name: otlp-http, port: 4318 }] }
