apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector, namespace: monitoring }
data:
  config.yaml: |
    receivers:
      otlp: { protocols: { grpc: { endpoint: 0.0.0.0:4317 }, http: { endpoint: 0.0.0.0:4318 } } }
    processors: { batch: {} }
    exporters:
      otlp/jaeger: { endpoint: jaeger.monitoring.svc:4317, tls: { insecure: true } }
    service: { pipelines: { traces: { receivers: [otlp], processors: [batch], exporters: [otlp/jaeger] } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: monitoring }
spec:
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.137.0
          args: ["--config=/conf/config.yaml"]
          ports: [{ containerPort: 4317 }, { containerPort: 4318 }]
          volumeMounts: [{ name: config, mountPath: /conf }]
      volumes: [{ name: config, configMap: { name: otel-collector } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: monitoring }
spec: { selector: { app: otel-collector }, ports: [{ name: grpc, port: 4317 }, { name: http, port: 4318 }] }
