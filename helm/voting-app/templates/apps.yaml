{{- range $name, $config := dict "vote" (dict "port" 8080 "image" .Values.images.vote "service" .Values.service.vote) "result" (dict "port" 8080 "image" .Values.images.result "service" .Values.service.result) }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $name }}, labels: { app: {{ $name }} } }
spec:
  replicas: 1
  selector: { matchLabels: { app: {{ $name }} } }
  template:
    metadata: { labels: { app: {{ $name }} } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $config.image.repository }}:{{ $config.image.tag }}"
          imagePullPolicy: {{ $config.image.pullPolicy }}
          {{- if eq $name "vote" }}
          env:
            - name: OPTION_A
              value: {{ default "Cats" $.Values.vote.optionA | quote }}
            - name: OPTION_B
              value: {{ default "Dogs" $.Values.vote.optionB | quote }}
          {{- end }}
          {{- if eq $name "result" }}
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ $.Values.postgres.existingSecret }}, key: url } }
          {{- end }}
          ports: [{ name: http, containerPort: {{ $config.port }} }]
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ ternary 10001 1000 (eq $name "vote") }}
            runAsGroup: {{ ternary 10001 1000 (eq $name "vote") }}
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{ toYaml $.Values.resources.web | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: {{ $name }} }
spec:
  type: {{ $config.service.type }}
  selector: { app: {{ $name }} }
  ports: [{ name: http, port: {{ $config.service.port }}, targetPort: http }]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          env:
            - name: DATABASE_CONNECTION_STRING
              valueFrom: { secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: connectionString } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources: {{ toYaml .Values.resources.worker | nindent 12 }}
