images:
  # Supply SHA tags for deployments; repository, tag, and pull policy are
  # intentionally configurable for both GHCR and images loaded into kind.
  vote: { repository: ghcr.io/itzbeejay01/example-voting-app-vote, tag: "1.0.0", pullPolicy: IfNotPresent }
  result: { repository: ghcr.io/itzbeejay01/example-voting-app-result, tag: "1.0.0", pullPolicy: IfNotPresent }
  worker: { repository: ghcr.io/itzbeejay01/example-voting-app-worker, tag: "1.0.0", pullPolicy: IfNotPresent }
  redis: { repository: redis, tag: 7.4-alpine, pullPolicy: IfNotPresent }
  postgres: { repository: postgres, tag: 15-alpine, pullPolicy: IfNotPresent }
imagePullSecrets: []
service:
  vote: { type: ClusterIP, port: 80 }
  result: { type: ClusterIP, port: 80 }
vote:
  optionA: Cats
  optionB: Dogs
postgres:
  storage: 2Gi
  username: postgres
  existingSecret: voting-app-db
resources:
  web: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
  worker: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
  data: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }

# The upstream PostgreSQL entrypoint must start with its normal root
# privileges to initialize/chown a fresh persistent volume before dropping
# privileges to the postgres account. Do not set pod/container runAsUser,
# runAsNonRoot, or fsGroup on the PostgreSQL workload.
